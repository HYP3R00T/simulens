version = 1
revision = 3
requires-python = ">=3.14"

[manifest]
members = [
    "simple-example",
    "simulens",
    "simulens-workspace",
]

[[package]]
name = "simple-example"
version = "0.1.0"
source = { virtual = "examples/simple-example" }
dependencies = [
    { name = "simulens" },
]

[package.metadata]
requires-dist = [{ name = "simulens", editable = "packages/simulens" }]

[[package]]
name = "simulens"
version = "0.0.1"
source = { editable = "packages/simulens" }

[[package]]
name = "simulens-workspace"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "simulens" },
]

[package.metadata]
requires-dist = [{ name = "simulens", editable = "packages/simulens" }]
