[project]
name = "simulens"
version = "0.0.1"
description = "A Python-first toolkit for interactive physics simulation and GPU-accelerated scientific visualization."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Rajesh", email = "hyperoot.tech@proton.me" }]
dependencies = [
  "pydantic>=2.13.5",
  "slangpy>=0.43.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
